<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard | CharMary</title>
<meta name="theme-color" content="#FFC107">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="shared/theme.css">
<style>
  body{min-height:100dvh}
  .wrap{max-width:1320px;margin:0 auto;padding:1rem 1rem 4rem}
  header.app{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;
    gap:.8rem;padding:.7rem 1rem;margin:0 -1rem 1.2rem;background:var(--glass);backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:.6rem;font-family:var(--font-display);font-weight:900}
  .brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
  .brand span{color:var(--accent)}
  .brand small{display:block;font-size:.58rem;letter-spacing:.16em;color:var(--muted);font-weight:700}
  .head-actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin-bottom:1rem}
  @media(max-width:760px){.stats{grid-template-columns:1fr 1fr}}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,193,7,.08)}
  .stat .num{font-family:var(--font-display);font-size:1.9rem;font-weight:900;line-height:1;margin-top:.35rem}
  .stat .lbl{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
  .stat i{color:var(--accent);font-size:.9rem}
  .toolbar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
  .toolbar input[type="search"]{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-pill);padding:.7rem 1rem;outline:none}
  .toolbar input[type="search"]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,193,7,.16)}
  .filters{display:flex;gap:.35rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-pill);padding:.25rem}
  .filters button{background:transparent;border:0;border-radius:var(--radius-pill);padding:.5rem .85rem;font-size:.76rem;font-weight:800;color:var(--muted);cursor:pointer;transition:.2s}
  .filters button.active{background:var(--accent);color:#000}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:.9rem}
  @media(max-width:420px){.grid{grid-template-columns:1fr}}
  .order{padding:1rem;cursor:pointer}
  .order-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.6rem}
  .order-id{font-family:var(--font-display);font-weight:900;font-size:.95rem}
  .order p{margin:.15rem 0;font-size:.76rem;color:var(--muted)}
  .order p b{color:var(--text);font-weight:600}
  .mini-route{display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:var(--muted);margin:.5rem 0}
  .mini-route .line{flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--border-strong) 0 4px,transparent 4px 8px)}
  .order-foot{display:flex;gap:.4rem;margin-top:.7rem;flex-wrap:wrap}
  .order-foot .btn{flex:1;padding:.55rem .6rem;font-size:.72rem;min-width:100px}
  .empty-state{padding:3rem 1rem;text-align:center;color:var(--muted);grid-column:1/-1}
  .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
  @media(max-width:520px){.modal-grid{grid-template-columns:1fr}}
  .kv{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:.6rem .7rem}
  .kv span{display:block;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .kv b{font-size:.82rem;word-break:break-word}
  .hide{display:none!important}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="overlay">
  <div class="card fade-up" style="width:min(360px,92vw)">
    <div style="text-align:center;margin-bottom:1rem">
      <img src="images/logo.jpg" style="width:64px;height:64px;border-radius:50%;border:2px solid var(--accent);object-fit:cover">
      <h2 style="margin-top:.6rem;font-size:1.2rem">Admin Console</h2>
      <p class="small muted">Live delivery operations</p>
    </div>
    <div class="field"><label>Username</label><input id="username" placeholder="admin" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="password" type="password" placeholder="••••" autocomplete="current-password"></div>
    <button class="btn btn-primary btn-block" onclick="login()"><i class="fas fa-lock-open"></i> Login</button>
    <p class="tiny faint" style="margin-top:.7rem;text-align:center">Demo credentials unchanged (admin / admin123)</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardContent" class="hide">
<div class="wrap">
  <header class="app">
    <div class="brand">
      <img src="images/logo.jpg" alt="CharMary">
      <div>CHAR<span>MARY</span><small>ADMIN CONSOLE</small></div>
    </div>
    <div class="head-actions">
      <span class="badge badge-live" id="connBadge"><span class="dot pulse"></span> Live</span>
      <button class="icon-btn" onclick="CM.toggle(event)" aria-label="Toggle theme"><i class="fas fa-sun" data-theme-icon></i></button>
      <button class="btn btn-ghost" onclick="exportCSV()"><i class="fas fa-file-csv"></i> Export</button>
      <button class="btn btn-danger" onclick="logout()"><i class="fas fa-arrow-right-from-bracket"></i> Logout</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat fade-up"><div class="lbl"><i class="fas fa-bolt"></i> Active</div><div class="num" id="statActive">0</div></div>
    <div class="stat fade-up"><div class="lbl"><i class="fas fa-circle-check"></i> Delivered</div><div class="num" id="statDone">0</div></div>
    <div class="stat fade-up"><div class="lbl"><i class="fas fa-layer-group"></i> Total</div><div class="num" id="statTotal">0</div></div>
    <div class="stat fade-up"><div class="lbl"><i class="fas fa-naira-sign"></i> Fees</div><div class="num" id="statFees">0</div></div>
  </div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search order, rider, sender, receiver or phone…">
    <div class="filters">
      <button class="active" data-f="all" onclick="setFilter('all', this)">All</button>
      <button data-f="active" onclick="setFilter('active', this)">Active</button>
      <button data-f="done" onclick="setFilter('done', this)">Completed</button>
    </div>
  </div>

  <div class="grid" id="ordersGrid">
    <div class="skeleton" style="height:210px;border-radius:20px"></div>
    <div class="skeleton" style="height:210px;border-radius:20px"></div>
    <div class="skeleton" style="height:210px;border-radius:20px"></div>
  </div>
</div>
</div>

<!-- MODAL -->
<dialog class="modal" id="orderModal">
  <div class="modal-head">
    <h3 style="font-size:1rem" id="mTitle">Order details</h3>
    <button class="icon-btn" onclick="document.getElementById('orderModal').close()" aria-label="Close"><i class="fas fa-xmark"></i></button>
  </div>
  <div class="modal-body" id="mBody"></div>
  <div class="modal-foot" id="mFoot"></div>
</dialog>

<script type="module">
import { db, collection, onSnapshot, orderRef, updateDoc, serverTimestamp } from './shared/firebase.js';

const $ = id => document.getElementById(id);
let all = [], filter = 'all', search = '', unsub = null, statsDone = false;

window.login = () => {
  if ($('username').value.trim() === 'admin' && $('password').value === 'admin123') {
    sessionStorage.setItem('cmAdminAuth', '1'); checkAuth();
  } else CM.toast('Incorrect username or password', 'err');
};
window.logout = () => { sessionStorage.removeItem('cmAdminAuth'); location.reload(); };
function checkAuth() {
  const ok = sessionStorage.getItem('cmAdminAuth') === '1';
  $('loginScreen').classList.toggle('hide', ok);
  $('dashboardContent').classList.toggle('hide', !ok);
  if (ok && !unsub) listen();
}
checkAuth();

function listen() {
  unsub = onSnapshot(collection(db, 'orders'), snap => {
    all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    all.sort((a, b) => (CM.ts(b.lastUpdated) || 0) - (CM.ts(a.lastUpdated) || 0));
    $('connBadge').className = 'badge badge-live';
    $('connBadge').innerHTML = '<span class="dot pulse"></span> Live';
    render();
  }, err => {
    $('connBadge').className = 'badge badge-active';
    $('connBadge').innerHTML = '<span class="dot"></span> Reconnecting…';
    console.error(err);
  });
}

window.setFilter = (f, btn) => {
  filter = f;
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b === btn));
  render();
};
$('search').addEventListener('input', e => { search = e.target.value.toLowerCase().trim(); render(); });

function progressOf(o) {
  const lat = Number(o.lat), lng = Number(o.lng), sLat = Number(o.startLat), sLng = Number(o.startLng), dLat = Number(o.destLat), dLng = Number(o.destLng);
  if (![lat, lng, sLat, sLng, dLat, dLng].every(Number.isFinite)) return null;
  return CM.progress({ lat, lng }, { lat: sLat, lng: sLng }, { lat: dLat, lng: dLng });
}
function stageOf(o, pct) {
  return CM.stage(o, Number.isFinite(Number(o.lat)), pct);
}

function matches(o) {
  if (filter === 'active' && o.status === 'delivered') return false;
  if (filter === 'done' && o.status !== 'delivered') return false;
  if (!search) return true;
  const hay = [o.id, o.riderName, o.riderPhone, o.senderName, o.senderPhone, o.receiverName, o.receiverPhone, o.destAddress, o.packageType].join(' ').toLowerCase();
  return hay.includes(search);
}

function render() {
  if (!statsDone) {
    statsDone = true;
    CM.countUp($('statActive'), all.filter(o => o.status !== 'delivered').length);
    CM.countUp($('statDone'), all.filter(o => o.status === 'delivered').length);
    CM.countUp($('statTotal'), all.length);
    CM.countUp($('statFees'), all.reduce((s, o) => s + (Number(o.fee) || 0), 0));
  } else {
    $('statActive').textContent = all.filter(o => o.status !== 'delivered').length;
    $('statDone').textContent = all.filter(o => o.status === 'delivered').length;
    $('statTotal').textContent = all.length;
    $('statFees').textContent = all.reduce((s, o) => s + (Number(o.fee) || 0), 0).toLocaleString('en-NG');
  }

  const list = all.filter(matches);
  const grid = $('ordersGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><p>No orders match this view.</p></div>`;
    return;
  }

  grid.innerHTML = list.map(o => {
    const done = o.status === 'delivered';
    const pct = progressOf(o);
    const st = stageOf(o, pct);
    const updated = CM.ago(CM.ts(o.lastUpdated));
    return `
      <article class="card order" onclick="openOrder('${o.id}')">
        <div class="order-top">
          <span class="order-id">#${o.id}</span>
          <span class="badge ${done ? 'badge-done' : 'badge-active'}">${done ? 'Delivered' : 'Active'}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem">
          <span class="small" style="font-weight:800">${CM.STAGES[st].label}</span>
          <span class="small mono">${pct == null ? '—' : pct + '%'}</span>
        </div>
        <div class="progress" style="margin:.4rem 0 .6rem"><div class="progress-fill" style="width:${pct == null ? 0 : pct}%"></div></div>
        <p>Rider: <b>${o.riderName || 'Unassigned'}</b> · ${o.riderBike || '—'}</p>
        <div class="mini-route"><span>${o.senderName || 'Sender'}</span><span class="line"></span><span>${o.receiverName || 'Receiver'}</span></div>
        <p>${o.packageType || 'Package'} · <b>${CM.naira(o.fee)}</b> · ${updated}</p>
        <div class="order-foot" onclick="event.stopPropagation()">
          <a class="btn btn-primary" href="track.html?id=${o.id}" target="_blank"><i class="fas fa-map-location-dot"></i> Map</a>
          <button class="btn btn-ghost" onclick="copyLink('${o.id}')"><i class="fas fa-link"></i> Copy</button>
          ${!done ? `<button class="btn btn-green" onclick="forceDone('${o.id}')"><i class="fas fa-check"></i> Done</button>` : ''}
        </div>
      </article>`;
  }).join('');
}

window.copyLink = id => {
  const url = new URL('track.html', location.href); url.searchParams.set('id', id);
  CM.copy(url.href, 'Tracking link copied');
};

window.forceDone = async id => {
  if (!confirm('Force mark ' + id + ' as delivered?')) return;
  try {
    await updateDoc(orderRef(id), { status: 'delivered', trackingState: 'completed', deliveredAt: serverTimestamp(), lastUpdated: serverTimestamp() });
    CM.toast(id + ' marked delivered', 'ok');
  } catch (e) { CM.toast('Failed: ' + e.message, 'err'); }
};

window.openOrder = id => {
  const o = all.find(x => x.id === id); if (!o) return;
  const pct = progressOf(o), st = stageOf(o, pct);
  $('mTitle').textContent = 'Order #' + o.id;
  $('mBody').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem">
      <span class="badge ${o.status === 'delivered' ? 'badge-done' : 'badge-active'}">${o.status === 'delivered' ? 'Delivered' : 'Active'}</span>
      <span class="small mono">${pct == null ? '—' : pct + '% · ' + CM.STAGES[st].label}</span>
    </div>
    <div class="progress" style="margin-bottom:1rem"><div class="progress-fill" style="width:${pct || 0}%"></div></div>
    <div class="timeline" style="margin-bottom:1rem">${CM.STAGES.map((s, i) =>
      `<div class="tl ${i < st ? 'done' : ''} ${i === st ? 'current' : ''}"><i class="fas ${s.icon}"></i><span>${s.label}</span></div>`).join('')}</div>
    <div class="modal-grid">
      <div class="kv"><span>Sender</span><b>${o.senderName || '—'}</b></div>
      <div class="kv"><span>Sender phone</span><b>${o.senderPhone || '—'}</b></div>
      <div class="kv"><span>Receiver</span><b>${o.receiverName || '—'}</b></div>
      <div class="kv"><span>Receiver phone</span><b>${o.receiverPhone || '—'}</b></div>
      <div class="kv"><span>Rider</span><b>${o.riderName || '—'}</b></div>
      <div class="kv"><span>Rider phone</span><b>${o.riderPhone || '—'}</b></div>
      <div class="kv"><span>Bike</span><b>${o.riderBike || '—'}</b></div>
      <div class="kv"><span>Delivery PIN</span><b>${o.deliveryCode || '—'}</b></div>
      <div class="kv"><span>Package</span><b>${o.packageType || '—'}</b></div>
      <div class="kv"><span>Priority</span><b>${(o.priority || 'standard').toUpperCase()}</b></div>
      <div class="kv"><span>Fee</span><b>${CM.naira(o.fee)}</b></div>
      <div class="kv"><span>Last update</span><b>${CM.ago(CM.ts(o.lastUpdated))}</b></div>
      <div class="kv" style="grid-column:1/-1"><span>Destination</span><b>${o.destAddress || '—'}</b></div>
      ${o.packageNote ? `<div class="kv" style="grid-column:1/-1"><span>Package note</span><b>${o.packageNote}</b></div>` : ''}
      <div class="kv"><span>GPS accuracy</span><b>${o.accuracy ? '±' + Math.round(o.accuracy) + 'm' : '—'}</b></div>
      <div class="kv"><span>Tracking state</span><b>${o.trackingState || '—'}</b></div>
    </div>`;
  $('mFoot').innerHTML = `
    <button class="btn btn-ghost" onclick="copyLink('${o.id}')"><i class="fas fa-link"></i> Copy link</button>
    <a class="btn btn-primary" href="track.html?id=${o.id}" target="_blank"><i class="fas fa-map-location-dot"></i> Open map</a>
    ${o.status !== 'delivered' ? `<button class="btn btn-green" onclick="forceDone('${o.id}');document.getElementById('orderModal').close()"><i class="fas fa-check"></i> Force done</button>` : ''}`;
  $('orderModal').showModal();
};

window.exportCSV = () => {
  if (!all.length) return CM.toast('No orders to export', 'err');
  const head = ['Order ID', 'Status', 'Stage', 'Progress %', 'Rider', 'Rider Phone', 'Bike', 'Sender', 'Sender Phone', 'Receiver', 'Receiver Phone', 'Destination', 'Package', 'Priority', 'Fee', 'PIN', 'Last Updated'];
  const rows = all.map(o => {
    const pct = progressOf(o), st = stageOf(o, pct);
    const d = CM.ts(o.lastUpdated);
    return [o.id, o.status || '', CM.STAGES[st].label, pct ?? '', o.riderName || '', o.riderPhone || '', o.riderBike || '',
      o.senderName || '', o.senderPhone || '', o.receiverName || '', o.receiverPhone || '', o.destAddress || '',
      o.packageType || '', o.priority || '', o.fee ?? '', o.deliveryCode || '', d ? new Date(d).toLocaleString() : ''];
  });
  const csv = [head, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'charmacy_deliveries.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  CM.toast('CSV exported', 'ok');
};

window.addEventListener('pagehide', () => { if (unsub) unsub(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
</html>
